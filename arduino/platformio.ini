; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Upload (→) uses this one. Pick "env:buzzer_test" in the bottom bar to run the test.
default_envs = uno

; The real Posture Bot sketch (src/main.cpp)
[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = +<*> -<buzzer_test.cpp>
monitor_speed = 9600

; Connection test: beeps D2 + blinks the built-in LED every second (src/buzzer_test.cpp)
[env:buzzer_test]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = -<*> +<buzzer_test.cpp>
monitor_speed = 9600
